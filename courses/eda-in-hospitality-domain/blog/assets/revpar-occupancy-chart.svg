<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="12" fill="url(#chartBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Legend -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Hospitality Metrics: Occupancy Rate vs. RevPAR</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Performance Benchmarking across City Properties (AtliQ Grand Hotels)</text>

  <!-- Legend -->
  <rect x="530" y="40" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="550" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">Occupancy Rate (%)</text>
  <circle cx="680" cy="47" r="5" fill="#f43f5e"/>
  <text x="692" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">RevPAR (INR)</text>

  <!-- Grid lines -->
  <line x1="80" y1="100" x2="740" y2="100" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="80" y1="160" x2="740" y2="160" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="80" y1="220" x2="740" y2="220" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="80" y1="280" x2="740" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="80" y1="340" x2="740" y2="340" stroke="#475569" stroke-width="1.5"/>

  <!-- Y-Axis Labels (Left: Occupancy %) -->
  <text x="65" y="105" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">100%</text>
  <text x="65" y="165" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">75%</text>
  <text x="65" y="225" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">50%</text>
  <text x="65" y="285" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">25%</text>
  <text x="65" y="345" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">0%</text>

  <!-- Bar 1: Mumbai (68% Occupancy = height 163px -> y = 177) -->
  <rect x="130" y="177" width="55" height="163" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="157" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">68%</text>
  <text x="157" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">Mumbai</text>

  <!-- Bar 2: Delhi (74% Occupancy = height 177px -> y = 163) -->
  <rect x="270" y="163" width="55" height="177" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="297" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">74%</text>
  <text x="297" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">Delhi</text>

  <!-- Bar 3: Bangalore (58% Occupancy = height 139px -> y = 201) -->
  <rect x="410" y="201" width="55" height="139" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="437" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">58%</text>
  <text x="437" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">Bangalore</text>

  <!-- Bar 4: Hyderabad (62% Occupancy = height 148px -> y = 192) -->
  <rect x="550" y="192" width="55" height="148" rx="4" fill="url(#barGrad)" filter="url(#glow)"/>
  <text x="577" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">62%</text>
  <text x="577" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">Hyderabad</text>

  <!-- RevPAR Trend Line Overlay -->
  <path d="M 157 140 L 297 125 L 437 175 L 577 155" fill="none" stroke="url(#lineGrad)" stroke-width="3"/>
  <circle cx="157" cy="140" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="297" cy="125" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="437" cy="175" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="577" cy="155" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>

  <text x="157" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fb7185">₹7,200</text>
  <text x="297" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fb7185">₹8,100</text>
  <text x="437" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fb7185">₹5,900</text>
  <text x="577" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fb7185">₹6,450</text>
</svg>
